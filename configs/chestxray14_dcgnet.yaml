project_name: "DCGNet-ChestXray"

dataset:
  name: "ChestXray14"
  image_dir: "datasets/ChestXray14/images"
  train_csv: "datasets/ChestXray14/train.csv"
  val_csv: "datasets/ChestXray14/val.csv"
  test_csv: "datasets/ChestXray14/test.csv"
  image_size: 224
  num_classes: 14

classes:
  - Atelectasis
  - Cardiomegaly
  - Effusion
  - Infiltration
  - Mass
  - Nodule
  - Pneumonia
  - Pneumothorax
  - Consolidation
  - Edema
  - Emphysema
  - Fibrosis
  - Pleural_Thickening
  - Hernia

model:
  name: "DenseNet121_DCGNet"
  backbone: "densenet121"
  pretrained: true
  dropout: 0.2

dcg:
  graph_dim: 256
  num_graph_layers: 2
  dropout: 0.2
  beta: 0.1
  graph_aux_weight: 0.05
  adjacency_source: "datasets/ChestXray14/train.csv"

training:
  epochs: 30
  batch_size: 16
  num_workers: 4
  optimizer: "adamw"
  learning_rate: 0.00003
  weight_decay: 0.0001
  scheduler: "cosine"
  loss: "bce"
  device: "auto"
  seed: 42

early_stopping:
  enabled: true
  patience: 8
  monitor: "val_map"

initialization:
  from_densenet: true
  densenet_checkpoint: "outputs/checkpoints/best_densenet121.pth"

augmentation:
  horizontal_flip: true
  rotation_degree: 10
  brightness: 0.1
  contrast: 0.1

normalization:
  mean:
    - 0.485
    - 0.456
    - 0.406
  std:
    - 0.229
    - 0.224
    - 0.225

metrics:
  - map
  - macro_auroc
  - micro_auroc
  - macro_f1
  - micro_f1
  - macro_precision
  - macro_recall
  - micro_precision
  - micro_recall
  - per_class_auroc
  - per_class_ap
  - per_class_f1
  - per_class_precision
  - per_class_recall

threshold:
  tune_on_validation: true
  per_class: true
  default: 0.5
  search_min: 0.05
  search_max: 0.5
  search_step: 0.01

checkpoint:
  save_dir: "outputs/checkpoints"
  save_best_only: true
  monitor: "val_map"
  filename: "best_densenet121_dcgnet.pth"

logging:
  print_frequency: 100

output:
  results_dir: "outputs/results"
  figures_dir: "outputs/figures"

visualization:
  gradcam: false
  attention_maps: false

experiment:
  name: "DCGNet_Full_ChestXray14"
